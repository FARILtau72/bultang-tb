<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Sistem Absensi Siswa</title>
    <meta name="description" content="Login ke Sistem Absensi QR Code SMK">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-container {
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 2;
        }

        .login-card {
            background: rgba(30, 32, 48, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
        }

        .login-brand {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-brand i {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-brand h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            margin: 0.5rem 0 0.25rem;
        }

        .login-brand p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            margin: 0;
        }

        /* Tab navigation */
        .login-tabs {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 1.5rem;
        }

        .login-tab {
            flex: 1;
            padding: 0.6rem 1rem;
            border: none;
            border-radius: 11px;
            background: transparent;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }

        .login-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.3);
        }

        .login-tab:hover:not(.active) {
            color: rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.06);
        }

        /* Form panels */
        .login-panel {
            display: none;
        }

        .login-panel.active {
            display: block;
            animation: fadeSlide 0.35s ease;
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Form styling */
        .login-card .form-label {
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
            font-size: 0.85rem;
            margin-bottom: 0.4rem;
        }

        .login-card .form-control {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .login-card .form-control:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
            color: #fff;
        }

        .login-card .form-control::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .input-icon-wrap {
            position: relative;
        }

        .input-icon-wrap i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.9rem;
        }

        .input-icon-wrap .form-control {
            padding-left: 2.75rem;
        }

        .btn-login {
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.35);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        /* Error message */
        .login-error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .login-error i {
            color: #ef4444;
        }

        /* Flash messages */
        .login-flash {
            background: rgba(59, 130, 246, 0.12);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #93c5fd;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="bg-orb bg-orb-top"></div>
    <div class="bg-orb bg-orb-bottom"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-brand">
                <i class="fa-solid fa-graduation-cap"></i>
                <h1>Absensi Siswa SMK</h1>
                <p>QR Attendance Platform</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                    <div class="login-flash">
                        <i class="fa-solid fa-circle-info"></i>
                        {{ message }}
                    </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            {% if error_message %}
            <div class="login-error">
                <i class="fa-solid fa-circle-exclamation"></i>
                {{ error_message }}
            </div>
            {% endif %}

            <div class="login-tabs">
                <button class="login-tab {{ 'active' if active_tab == 'siswa' }}" data-tab="siswa" type="button">
                    <i class="fa-solid fa-user-graduate me-1"></i>Siswa
                </button>
                <button class="login-tab {{ 'active' if active_tab == 'admin' }}" data-tab="admin" type="button">
                    <i class="fa-solid fa-user-shield me-1"></i>Admin
                </button>
            </div>

            <!-- Siswa Login -->
            <div class="login-panel {{ 'active' if active_tab == 'siswa' }}" id="panel-siswa">
                <form method="POST" action="{{ url_for('auth.login_page') }}" autocomplete="off">
                    <input type="hidden" name="login_type" value="siswa">
                    <div class="mb-3">
                        <label class="form-label">Nama Lengkap</label>
                        <div class="input-icon-wrap">
                            <i class="fa-solid fa-user"></i>
                            <input type="text" name="nama" class="form-control" placeholder="Masukkan nama lengkap" required autofocus>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">NIS</label>
                        <div class="input-icon-wrap">
                            <i class="fa-solid fa-id-card"></i>
                            <input type="text" name="nis" class="form-control" placeholder="Masukkan NIS" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-login">
                        <i class="fa-solid fa-right-to-bracket me-2"></i>Masuk sebagai Siswa
                    </button>
                </form>
            </div>

            <!-- Admin Login -->
            <div class="login-panel {{ 'active' if active_tab == 'admin' }}" id="panel-admin">
                <form method="POST" action="{{ url_for('auth.login_page') }}" autocomplete="off">
                    <input type="hidden" name="login_type" value="admin">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <div class="input-icon-wrap">
                            <i class="fa-solid fa-user-shield"></i>
                            <input type="text" name="username" class="form-control" placeholder="Username admin" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <div class="input-icon-wrap">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" name="password" class="form-control" placeholder="Password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-login">
                        <i class="fa-solid fa-right-to-bracket me-2"></i>Masuk sebagai Admin
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.login-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.login-panel').forEach(p => p.classList.remove('active'));

                this.classList.add('active');
                document.getElementById('panel-' + this.dataset.tab).classList.add('active');
            });
        });
    </script>
</body>
</html>
